[metadata]
name = httppackets
version = 0.1.0a0
description = Streaming, callback-based parsers and serializers for HTTP/1.1 requests and responses.
author = Jifeng Wu
author_email = jifengwu2k@gmail.com
license = MIT
url = https://github.com/jifengwu2k/httppackets
classifiers =
    Programming Language :: Python :: 2
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=2
install_requires =
    enum34; python_version < "3.4"
    lark<=0.12.0; python_version < "3"
    lark; python_version >= "3"
    six
    typing; python_version < "3.5"

[bdist_wheel]
universal = 1
